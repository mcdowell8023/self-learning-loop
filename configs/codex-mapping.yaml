runtime_id: codex
workspace_paths:
  - ~/.codex/sessions
  - ~/.codex
session_format: jsonl
session_glob: "**/*.jsonl"
field_mapping:
  role: $.role
  content: $.content
  timestamp: $.timestamp
event_extractor:
  type: jsonpath
  template: |
    {"type":"{{role}}","content":"{{content}}","timestamp":"{{timestamp}}","sessionId":"{{filename_basename}}"}
notes: |
  ⚠️ Codex schema 在 v1.1 阶段未实测，部署前需调整。
